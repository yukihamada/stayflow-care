<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ページが見つかりません — StayFlow Care</title>
<meta name="robots" content="noindex,follow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0e7490">
<style>
  :root{--ink:#15242b;--muted:#5f7178;--sea:#0e7490;--sea-ink:#083c48;--sand:#fbf8f2;--coral:#c8441f}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--sand);
       min-height:100vh;display:flex;flex-direction:column;line-height:1.8}
  .logo{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:17px;color:var(--sea-ink);text-decoration:none}
  .logo .dot{width:10px;height:10px;border-radius:50%;background:var(--coral)}
  .logo small{font-family:inherit;font-size:10px;letter-spacing:.18em;color:var(--muted);font-weight:700}
  main{flex:1;display:grid;place-items:center;text-align:center;padding:40px 22px}
  .code{font-family:inherit;font-size:64px;font-weight:800;color:#cfe3e8;line-height:1}
  h1{font-size:22px;font-weight:800;margin:14px 0 10px}
  p{color:var(--muted);font-size:14.5px;margin-bottom:26px}
  .btn{display:inline-block;background:var(--sea);color:#fff;text-decoration:none;font-weight:700;
       padding:13px 26px;border-radius:12px;font-size:15px}
  .btn:hover{background:var(--sea-deep,#0b5566)}
  footer{padding:22px;text-align:center;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <div>
    <a href="/" class="logo" aria-label="StayFlow Care ホーム"><span class="dot" aria-hidden="true"></span>StayFlow<small>CARE</small></a>
    <div class="code" style="margin-top:24px">404</div>
    <h1>ページが見つかりません</h1>
    <p>お探しのページは移動または削除された可能性があります。</p>
    <a href="/" class="btn">トップページへ戻る</a>
  </div>
</main>
<footer>© <span id="y"></span> StayFlow Care</footer>
<script>document.getElementById('y').textContent=new Date().getFullYear();</script>
</body>
</html>
